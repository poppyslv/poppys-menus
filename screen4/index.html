<script>
(function(){
  var st=document.getElementById('stage'), last='';
  function fit(){
    var de=document.documentElement, vv=window.visualViewport;
    var w=Math.min(de.clientWidth||window.innerWidth, vv?vv.width:1e9, window.innerWidth||1e9);
    var h=Math.min(de.clientHeight||window.innerHeight, vv?vv.height:1e9, window.innerHeight||1e9);
    if(!w||!h) return;
    var s=Math.min(w/1920, h/1080), v=s.toFixed(4);
    if(v!==last){ last=v; st.style.transform='translate(-50%,-50%) scale('+v+')'; }
  }
  window.addEventListener('resize', fit); window.addEventListener('load', fit);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  fit(); setInterval(fit, 1000);
  // Seasonal theme: Thanksgiving from Nov 1 to Thanksgiving Day (4th Thursday). ?season=tg forces it on, ?season=off forces it off.
  (function(){
    var d=new Date(), first=new Date(d.getFullYear(),10,1).getDay(), tday=1+((4-first+7)%7)+21;
    var q=(location.search.match(/season=([a-z]+)/)||[])[1];
    var on = q ? q==='tg' : (d.getMonth()===10 && d.getDate()<=tday);
    var root=st.firstElementChild; if(on && root) root.classList.add('season-tg');
  })();
  // Sparkle wave: every TV follows the wall clock, so screens 1-6 sparkle in turn every 3 minutes.
  var P=180, GAP=1.0;
  [].forEach.call(document.querySelectorAll('[data-wave]'), function(e){
    var n=+e.getAttribute('data-wave'), t=((Date.now()/1000-(n-1)*GAP)%P+P)%P;
    e.style.animationDelay=(-t).toFixed(2)+'s';
  });
  // Pick up menu changes automatically: reload every 15 minutes.
  setTimeout(function(){ location.reload(); }, 15*60*1000);
})();
</script>
